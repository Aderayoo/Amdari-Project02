customRules:
  secureflow-rules.yaml: |-
    - rule: Shell spawned in container
      desc: A shell was spawned inside a running container
      condition: spawned_process and container and shell_procs
      output: "Shell spawned in container (user=%user.name container=%container.name image=%container.image.repository shell=%proc.name) k8s_pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: WARNING
      tags: [container, shell, secureflow]

    - rule: Sensitive file read in container
      desc: A sensitive file was read inside a container
      condition: open_read and container and fd.name in (/etc/shadow, /etc/passwd)
      output: "Sensitive file read (user=%user.name container=%container.name file=%fd.name) k8s_pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: CRITICAL
      tags: [container, filesystem, secureflow]

    - rule: Package manager executed in container
      desc: A package manager ran inside a container at runtime
      condition: spawned_process and container and proc.name in (apt, apt-get, yum, pip, pip3)
      output: "Package manager executed (user=%user.name container=%container.name command=%proc.cmdline) k8s_pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: ERROR
      tags: [container, package, secureflow]

    - rule: Cryptocurrency miner detected
      desc: A process name associated with cryptocurrency mining was detected
      condition: >
        spawned_process and container and
        proc.name in (minerd, cpuminer, xmrig, xmrig-notls, stratum)
      output: "Cryptocurrency miner detected (user=%user.name container=%container.name process=%proc.name) k8s_pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: CRITICAL
      tags: [container, cryptomining, secureflow]

    - rule: Reverse shell detected
      desc: A process is piping stdin/stdout to a network socket — classic reverse shell pattern
      condition: >
        spawned_process and container and
        ((proc.name = bash and proc.args contains "i >& /dev/tcp") or
         (proc.name = sh and proc.args contains "i >& /dev/tcp") or
         (proc.name = nc and proc.args contains "-e") or
         (proc.name = ncat and proc.args contains "-e"))
      output: "Reverse shell detected (user=%user.name container=%container.name command=%proc.cmdline) k8s_pod=%k8s.pod.name ns=%k8s.ns.name"
      priority: CRITICAL
      tags: [container, shell, network, secureflow]
