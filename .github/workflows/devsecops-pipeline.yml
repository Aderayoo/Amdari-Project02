name: SecureFlow DevSecOps Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  hello-world:
    name: Pipeline Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Hello World
        run: |
          echo "SecureFlow pipeline is alive"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  stage-1-secrets:
    name: Stage 1 - Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stage-2-sast:
    name: Stage 2 - SonarQube SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  stage-3-image-scan:
    name: Stage 3 - Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build auth-service image
        run: docker build -t auth-service:test ./services/auth-service
      - name: Scan auth-service
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: auth-service:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Build transaction-service image
        run: docker build -t transaction-service:test ./services/transaction-service
      - name: Scan transaction-service
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: transaction-service:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Build frontend image
        run: docker build -t frontend:test ./services/frontend
      - name: Scan frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  stage-4-iac-scan:
    name: Stage 4 - IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trivy K8s manifest scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Checkov Terraform scan
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          soft_fail: false
          framework: terraform

  stage-5-security-gate:
    name: Stage 5 - Security Gate
    runs-on: ubuntu-latest
    needs: [stage-1-secrets, stage-2-sast, stage-3-image-scan, stage-4-iac-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run security gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_RESULT: ${{ needs.stage-1-secrets.result }}
          TRIVY_IMAGE_RESULT: ${{ needs.stage-3-image-scan.result }}
          IAC_RESULT: ${{ needs.stage-4-iac-scan.result }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x pipeline/scripts/security-gate.sh
          ./pipeline/scripts/security-gate.sh
